{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 企业员工管理系统</title>
    <link rel="stylesheet" href="{% static 'app01/plugins/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'app01/css/app.css' %}">
</head>
<body class="login-page">
<div class="login-box panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">企业员工管理系统 - 登录</h3>
    </div>
    <div class="panel-body">
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-control" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="row">
                    <div class="col-xs-7">
                        <input type="text" class="form-control" name="captcha" placeholder="请输入验证码" required>
                    </div>
                    <div class="col-xs-5">
                        <img src="{% url 'captcha' %}" alt="验证码" class="captcha-img"
                             title="点击刷新验证码"
                             onclick="this.src='{% url 'captcha' %}?ts=' + new Date().getTime();">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>
    </div>
    <div class="panel-footer text-muted text-center">
        演示账号：admin / admin123
    </div>
</div>
</body>
</html>
