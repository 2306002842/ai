{% extends "app01/base.html" %}

{% block title %}分配角色 - 企业员工管理系统{% endblock %}

{% block content %}
<div class="panel panel-default" style="max-width: 560px;">
    <div class="panel-heading">为用户【{{ user_obj.username }}】分配角色</div>
    <div class="panel-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group {% if form.roles.errors %}has-error{% endif %}">
                {{ form.label }}
                {{ form.roles }}
                {% for error in form.roles.errors %}
                    <span class="help-block">{{ error }}</span>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary">保 存</button>
            <a class="btn btn-default" href="/rbac/user/list/">取消</a>
        </form>
    </div>
</div>
{% endblock %}
