{% extends 'app01/base.html' %}
{% block title %}AI 生成招聘 JD{% endblock %}
{% block content %}
<h3>🎯 T2 · 智能生成招聘 JD</h3>
<p style="color:#6b7280">三段式提示词（角色 + 要求 + 输出格式）驱动，输入岗位名称即可。</p>

<div class="row" style="margin-bottom:12px">
  <div class="col-md-8">
    <input id="position" type="text" class="form-control" placeholder="例如：Python 后端工程师" value="Python 后端工程师">
  </div>
  <div class="col-md-4">
    <button id="btn" class="btn btn-primary btn-block">✨ 生成 JD</button>
  </div>
</div>

<div id="result" class="panel panel-default" style="display:none">
  <div class="panel-heading"><b>💡 模型生成结果</b></div>
  <div class="panel-body">
    <pre id="result-body" style="white-space:pre-wrap;font-size:13px;line-height:1.7;margin:0"></pre>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const $ = id => document.getElementById(id);
$('#btn').onclick = async () => {
  const pos = $('#position').value.trim();
  if (!pos) { alert('请输入岗位名称'); return; }
  const btn = $('#btn'); btn.disabled = true; btn.textContent = '生成中...';
  const box = $('#result'); const body = $('#result-body');
  box.style.display = 'block'; body.textContent = '🤖 大模型思考中...';
  try {
    const fd = new FormData(); fd.append('position', pos);
    const r = await fetch('/api/ai/generate-jd/', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.ok) { body.textContent = data.jd; }
    else { body.textContent = '❌ ' + data.msg; }
  } catch(e) { body.textContent = '❌ 请求失败: ' + e.message; }
  btn.disabled = false; btn.textContent = '✨ 生成 JD';
};
$('#position').onkeydown = e => { if (e.key === 'Enter') $('#btn').onclick(); };
</script>
{% endblock %}
