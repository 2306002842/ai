{% extends 'app01/base.html' %}
{% block title %}AI 数据智能点评{% endblock %}
{% block content %}
<h3>📊 T4 · 数据智能点评</h3>
<p style="color:#6b7280">读取员工考勤 + 薪资数据 → 转为文本 → 注入提示词 → 生成点评。</p>

<div class="row" style="margin-bottom:12px">
  <div class="col-md-4">
    <label>员工</label>
    <select id="emp" class="form-control">
      {% for e in employees %}
        <option value="{{ e.id }}">{{ e.name }}（{{ e.depart }}）</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label>月份</label>
    <select id="mon" class="form-control">
      {% for m in months %}
        <option value="{{ m }}">{{ m }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4" style="padding-top:24px">
    <button id="btn" class="btn btn-warning btn-block">💡 生成点评</button>
  </div>
</div>

<div id="result" class="panel panel-default" style="display:none">
  <div class="panel-heading"><b>📋 分析结果</b></div>
  <div class="panel-body" id="result-body" style="white-space:pre-wrap;font-size:13px;line-height:1.7"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const $ = id => document.getElementById(id);
$('#btn').onclick = async () => {
  const emp = $('#emp').value, mon = $('#mon').value;
  const btn = $('#btn'); btn.disabled = true; btn.textContent = '分析中...';
  const box = $('#result'); const body = $('#result-body');
  box.style.display = 'block'; body.textContent = '🤖 读取数据 + 模型分析中...';
  try {
    const fd = new FormData(); fd.append('employee_id', emp); fd.append('month', mon);
    const r = await fetch('/api/ai/data-review/', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.ok) {
      body.textContent = '👤 员工: ' + data.employee + '\n' +
                        '📅 月份: ' + data.month + '\n' +
                        '📥 考勤: ' + data.attendance + '\n' +
                        '💰 薪资: ' + data.salary + '\n\n' +
                        '💬 点评: ' + data.review;
    } else { body.textContent = '❌ ' + data.msg; }
  } catch(e) { body.textContent = '❌ 请求失败: ' + e.message; }
  btn.disabled = false; btn.textContent = '💡 生成点评';
};
</script>
{% endblock %}
